services:
  openchamber:
    user: "${UID}:${GID}"
    build:
      context: .
    volumes:
      - "./opencode-config:/home/.config/opencode"
      - "./.config/opencode-data:/home/.local/share/opencode"
      - "./.config/opencode-state:/home/.local/state/opencode"
      - "./.config/opencode-cache:/home/.cache/opencode"
      - "./.config/openchamber-config:/home/.config/openchamber"
      - "${REPOSITORIES_PATH:-./repositories}:/home/repositories"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      OPENCHAMBER_PORT: ${OPENCHAMBER_PORT:-5200}
      OPENCODE_BINARY: /home/.opencode/bin/opencode
      OPENCHAMBER_ALLOW_UNAUTHENTICATED_LAN: true
      UI_PASSWORD: ${UI_PASSWORD:-}
    restart: unless-stopped
    network_mode: host
